name: Diag macOS cli_actor_stress hang

# Temporary diagnostic (never merged), validating the S51 fix: loops the cli_actor_stress workload on
# macOS against protoCore 3.6.1 and 3.6.2 and, on a hang, captures every
# thread's stack.

on:
  push:
    branches: ['diag/macos-loaded-ctest-failures']

permissions:
  contents: read

jobs:
  loop:
    name: ${{ matrix.ref }} transitions=${{ matrix.transitions }} (${{ matrix.shard }})
    runs-on: macos-15
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        ref: [v3.6.2]
        transitions: ['1']
        shard: [a, b, c, d]
        include:
          - ref: v3.6.2
            transitions: '1'
            shard: e
          - ref: v3.6.2
            transitions: '1'
            shard: f
          - ref: v3.6.1
            transitions: '1'
            shard: a
    steps:
      - uses: actions/checkout@v4
        with: { path: protoST }
      - uses: actions/checkout@v4
        with: { repository: numaes/protoCore, ref: '${{ matrix.ref }}', path: protoCore }
      - uses: actions/checkout@v4
        with: { repository: gamarino/protoIO, ref: v0.7.1, path: protoIO }
      - name: Dependencies
        run: |
          for f in readline openssl@3 ninja coreutils; do brew list "$f" >/dev/null 2>&1 || brew install "$f"; done
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "EXTRA_PREFIX=;$(brew --prefix readline)" >> "$GITHUB_ENV"
      - name: Build protoCore and protoST (RelWithDebInfo)
        run: |
          cmake -S protoCore -B protoCore/build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build protoCore/build --parallel 4
          cmake --install protoCore/build --prefix "$GITHUB_WORKSPACE/prefix"
          cd protoST
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPROTOCORE_REQUIRE_PACKAGE=ON \
            "-DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/prefix$EXTRA_PREFIX" "-DOPENSSL_ROOT_DIR=$OPENSSL_ROOT_DIR"
          cmake --build build --parallel 4
      - name: Loop the workload beside the real ctest -j2 neighbours
        env:
          PROTOCORE_SHAPE_TRANSITIONS: ${{ matrix.transitions }}
        run: |
          set +e
          cat > w.st <<'ST'
          Object subclass: #Sink instanceVariableNames: 'count'.
          Sink >> initialize  count := 0. ^ self.
          Sink >> ping  count := count + 1. ^ count.
          Sink >> count  ^ count.
          base := Sink new. base initialize.
          sink := base asActor.
          1 to: 1000 do: [ :i | sink ping ].
          (sink count) wait.
          ST
          # Every loop is bounded by one wall-clock deadline, so the step always
          # reaches its summary well inside the job timeout.
          DEADLINE=$(( $(date +%s) + 50*60 )); export DEADLINE
          cat > loop.sh <<'SH'
          #!/bin/bash
          L=$1; P=protoST/build/protost; i=0; hangs=0; bad=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            i=$((i+1))
            "$P" --print-last w.st > out-$L.txt 2>&1 &
            pid=$!; t=0
            while kill -0 $pid 2>/dev/null && [ $t -lt 300 ]; do sleep 0.1; t=$((t+1)); done
            if kill -0 $pid 2>/dev/null; then
              hangs=$((hangs+1)); echo "::warning::loop $L hang at run $i (pid $pid)"
              if [ $hangs -le 2 ]; then
                sudo lldb -p $pid --batch -o "thread backtrace all" > "lldb-$L-$i.txt" 2>&1
                sample $pid 2 -file "sample-$L-$i.txt" >/dev/null 2>&1
                echo "=== lldb loop $L run $i"; cat "lldb-$L-$i.txt"
              fi
              kill -9 $pid; wait $pid 2>/dev/null
            else
              wait $pid; rc=$?; last=$(tail -1 out-$L.txt)
              if [ $rc -ne 0 ] || [ "$last" != 1000 ]; then bad=$((bad+1)); echo "loop $L bad run $i rc=$rc last='$last'"; fi
            fi
            [ $((i % 100)) -eq 0 ] && echo "loop $L progress runs=$i hangs=$hangs bad=$bad"
          done
          echo "loop $L runs=$i hangs=$hangs bad=$bad"
          SH
          chmod +x loop.sh
          # The neighbours CI actually runs beside this test: the whole suite at -j2.
          ( n=0; while [ "$(date +%s)" -lt "$DEADLINE" ]; do
              n=$((n+1)); mkdir -p ctestlogs
              ctest --test-dir protoST/build -j2 -E cli_actor_stress --timeout 300 --output-on-failure \
                --output-log "ctestlogs/pass-$n.log" > /dev/null 2>&1
              rc=$?
              echo "neighbour suite pass $n rc=$rc"
              if [ $rc -ne 0 ]; then
                cp protoST/build/Testing/Temporary/LastTestsFailed.log "ctestlogs/failed-$n.txt" 2>/dev/null
                echo "pass $n failed tests: $(sed 's/^[0-9]*://' ctestlogs/failed-$n.txt 2>/dev/null | tr '\n' ' ')"
              else
                rm -f "ctestlogs/pass-$n.log"
              fi
            done ) & nb=$!
          ./loop.sh 1 & l1=$!
          ./loop.sh 2 & l2=$!
          wait $l1 $l2 $nb
          echo "ref=${{ matrix.ref }} transitions=${{ matrix.transitions }} shard=${{ matrix.shard }} done" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stacks-${{ matrix.ref }}-t${{ matrix.transitions }}-${{ matrix.shard }}
          path: |
            lldb-*.txt
            sample-*.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctestlogs-${{ matrix.ref }}-t${{ matrix.transitions }}-${{ matrix.shard }}
          path: ctestlogs/
          if-no-files-found: ignore
