name: Cross-platform

# macOS and Windows. Linux is ci.yml's; this workflow adds the two platforms
# nobody here can run locally, against an INSTALLED protoCore package (the
# supported mode on Windows) and the sibling protoIO source tree. Refs pinned
# like ci.yml's.

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROTOCORE_REPO: numaes/protoCore
  # protoCore 2.12.0 (tag v2.12.0, f969d15), as ci.yml's main job. The declared
  # minimum (2.11.0) is built by ci.yml's floor entry only.
  PROTOCORE_REF: f969d151408e753786acffa581a9c8cfe0aa7dfa
  PROTOIO_REPO: gamarino/protoIO
  # protoIO 0.2.2 (main, 1611ff9), the declared floor.
  PROTOIO_REF: 1611ff9cf8d499cdc42a6e108e42ecfc36fd8164
  # As in ci.yml: a wall-clock verdict never gates.
  NON_GATING_TESTS: '^(cli_concurrent_first_call|F6 v2 T7: two actors run in parallel \(wall-clock proof\))$'

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple clang, arm64)
            os: macos-14
            exclude_tests: ''
          - name: Windows (MSVC, x64)
            os: windows-2022
            # cli_sigint needs pgrep, kill -INT on a native process and mkfifo,
            # which Git Bash cannot give a native program (Ctrl-C was checked by
            # hand). The tutorial's chapter 15 runs `echo $PUMP_MODE`, POSIX
            # shell syntax cmd.exe does not expand. docs/INSTALLATION.md,
            # "Windows (MSVC)".
            exclude_tests: '|^cli_sigint$|^docs/docs/tutorial/15-input-and-output\.md$'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out protoST
        uses: actions/checkout@v4
        with:
          path: protoST

      - name: Check out protoCore as a sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PROTOCORE_REPO }}
          ref: ${{ env.PROTOCORE_REF }}
          path: protoCore

      - name: Check out protoIO as a sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PROTOIO_REPO }}
          ref: ${{ env.PROTOIO_REF }}
          path: protoIO

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          for f in readline openssl@3 ninja coreutils; do brew list "$f" >/dev/null 2>&1 || brew install "$f"; done
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "EXTRA_PREFIX=;$(brew --prefix readline)" >> "$GITHUB_ENV"
          # The test scripts use GNU timeout, which macOS does not ship. Only
          # timeout goes on PATH: coreutils' whole gnubin would also shadow
          # the system tools with GNU ones that do not work on macOS (stdbuf
          # cannot inject its library into a program there).
          mkdir -p "$RUNNER_TEMP/gnu-timeout"
          ln -sf "$(brew --prefix)/bin/gtimeout" "$RUNNER_TEMP/gnu-timeout/timeout"
          echo "$RUNNER_TEMP/gnu-timeout" >> "$GITHUB_PATH"

      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          for d in "C:/Program Files/OpenSSL" "C:/Program Files/OpenSSL-Win64"; do
            if [ -f "$d/include/openssl/ssl.h" ]; then echo "OPENSSL_ROOT_DIR=$d" >> "$GITHUB_ENV"; break; fi
          done
          echo "PYTHON_EXE=$(cygpath -m "$(command -v python)")" >> "$GITHUB_ENV"

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build and install protoCore
        run: |
          cmake -S protoCore -B protoCore/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build protoCore/build --parallel 4
          cmake --install protoCore/build --prefix "$GITHUB_WORKSPACE/prefix"

      - name: Configure protoST
        # The build directory lives inside the checkout: that is how protost
        # finds lib/ (as on Linux).
        working-directory: protoST
        run: >
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DPROTOCORE_REQUIRE_PACKAGE=ON
          "-DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/prefix$EXTRA_PREFIX"
          ${OPENSSL_ROOT_DIR:+"-DOPENSSL_ROOT_DIR=$OPENSSL_ROOT_DIR"}
          ${PYTHON_EXE:+"-DPython3_EXECUTABLE=$PYTHON_EXE"}
          ${{ runner.os == 'Windows' && '-DPROTOST_WARNINGS_AS_ERRORS=ON' || '' }}

      - name: Build protoST
        id: build
        working-directory: protoST
        run: cmake --build build --parallel 4

      - name: Report the registered test count
        working-directory: protoST
        run: |
          COUNT=$(ctest --test-dir build -N | tail -1)
          echo "$COUNT"
          echo "protoST ctest (${{ runner.os }}): $COUNT" >> "$GITHUB_STEP_SUMMARY"

      - name: Test suite
        working-directory: protoST
        run: ctest --test-dir build -j2 --output-on-failure --timeout 600 -E "${NON_GATING_TESTS}${{ matrix.exclude_tests }}" < /dev/null

      - name: The ZIP runs on its own (Windows)
        # Unpacked into a clean directory and run from there, with PATH holding
        # only the Windows directories: nothing from the build tree, the
        # protoCore prefix or the OpenSSL installation can be found, so every
        # DLL protost.exe needs must come from the ZIP. The runner has the MSVC
        # runtime installed system-wide, so its DLLs are checked by name. Runs
        # whenever the build succeeded, whatever the test suite's verdict.
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.build.outcome == 'success' }}
        working-directory: protoST/build
        run: |
          # Every generator the configuration enabled: the ZIP, and the NSIS
          # installer when makensis is on the runner.
          cpack
          if grep -q 'CPACK_GENERATOR "[^"]*NSIS' CPackConfig.cmake; then
            ls protost-*-win64.exe || { echo "NSIS was enabled but built no installer"; exit 1; }
            echo "protoST Windows installer built: $(ls protost-*-win64.exe)" >> "$GITHUB_STEP_SUMMARY"
          fi
          zip=$(ls protost-*-win64.zip | head -1)
          unzip -l "$zip"
          for dll in vcruntime140.dll msvcp140.dll; do
            unzip -l "$zip" | grep -qi "/bin/$dll\$" || { echo "the ZIP has no bin/$dll"; exit 1; }
          done
          unzip -l "$zip" | grep -qi "/LICENSE-OpenSSL" || { echo "the ZIP has no OpenSSL licence"; exit 1; }
          clean="$RUNNER_TEMP/zip-check"; rm -rf "$clean"; mkdir -p "$clean/work"
          unzip -q "$zip" -d "$clean"
          exe=$(ls "$clean"/*/bin/protost.exe)
          printf "| s | s := 0. 1 to: 10 do: [:i | s := s + i]. Transcript showCr: 'sum ' , s printString.\n(OSProcess command: 'echo \"a b\"') displayNl.\n" > "$clean/work/check.st"
          cd "$clean/work"
          sys="$(cygpath -u "$WINDIR")/System32"
          clean_path="$sys:$(cygpath -u "$WINDIR"):$sys/Wbem"
          /usr/bin/env PATH="$clean_path" "$exe" --version
          out=$(/usr/bin/env PATH="$clean_path" "$exe" check.st | tr -d '\r')
          echo "$out"
          [ "$out" = "$(printf 'sum 55\n"a b"')" ] || { echo "unexpected output from the unpacked protost"; exit 1; }
          /usr/bin/env PATH="$clean_path" "$exe" venv create venv-check
          [ -s venv-check/bin/activate.bat ] || { echo "venv create from the ZIP wrote no activate.bat"; exit 1; }
