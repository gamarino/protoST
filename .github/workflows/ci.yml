name: CI

# protoST had no continuous integration until this file existed.  This is the
# runtime that reclaimed 0 cells of 2,748,398 for its entire history behind 848
# passing tests (docs/CONFORMANCE.md, S15), so a suite that runs only when
# somebody remembers is not a theoretical problem here.
#
# HOW protoCore IS OBTAINED: checked out as a SIBLING directory and built into
# ../protoCore/build_release, the first path protoST's developer fallback
# searches (CMakeLists.txt, decision D-I1).  No `cmake --install` is involved.
# The installed-package mode exists to check version and ABI against a prefix
# that may be stale; on a runner nothing is stale, because both trees are built
# from source in the same job -- so the hazard that mode protects against cannot
# arise here, and the configuration CI runs is the one contributors run.
#
# HOW protoIO IS OBTAINED: the same way, as a sibling checkout pinned to a
# commit.  It is built into ../protoIO/build_release (library only, no tests)
# and protoST is configured with -DprotoIO_DIR pointing at that build tree, so
# the job exercises protoST's find_package(protoIO) path; without it the build
# would fall back to compiling ../protoIO as a subdirectory, which also works.
#
# WHICH protoCore REF: pinned for push and pull_request, `master` for the
# nightly schedule.  A pinned ref makes a red pull request unambiguous.  The
# schedule keeps the integration signal separate, and the summary always records
# the protoCore commit actually used.  The `test` job runs twice: against the
# pinned release (3.5.0) and against the declared minimum (3.4.0, the floor
# entry -- this repository's only floor job; it stays on 3.4.0 on the schedule).
# protoCore 3.4.0 changed the ABI (SOVERSION 5), so no older protoCore can
# satisfy the build; 3.5.0 kept SOVERSION 5.
#
# TWO BUGS OF THIS REPOSITORY'S OWN SHAPE THIS FILE HAS TO HANDLE:
#
#   S18  A debugger unit test attaches a session without setting an input stream,
#        and DebuggerRuntime resolves an unset stream to std::cin.  Run with an
#        open stdin, the suite hangs -- 14 minutes observed before it was killed,
#        with no attribution.  Run with stdin at EOF the read fails at once and
#        the suite finishes.  EVERY ctest invocation below therefore takes
#        `< /dev/null`.  On a runner the alternative is a wasted job that reports
#        nothing.
#
#   S19  cli_concurrent_first_call used to hang intermittently.  The cause, a
#        lost wakeup in libstdc++ 13's std::counting_semaphore, was captured
#        live and removed in 06e1009 (docs/STATUS.md, S19).  The test was kept
#        out of the gate while evidence accumulated: it then passed on the first
#        attempt in every one of 59 CI runs (2026-09-29 to 2026-10-12, 40
#        launches each) and in a local stress run, so since 0.6.3 it gates
#        again.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 04:27 UTC daily: the integration run against protoCore master.
    - cron: '27 4 * * *'
  workflow_dispatch:

# The workflow reads source and runs tests; it needs nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROTOCORE_REPO: numaes/protoCore
  # protoCore 3.5.0 (tag v3.5.0, commit 64ca282e), SOVERSION 5: what every
  # push and pull request builds against. The declared minimum, 3.4.0 (the
  # first SOVERSION 5 release), is what the floor entry of the `test` job
  # builds. Bump deliberately.
  PROTOCORE_REF: ${{ github.event_name == 'schedule' && 'master' || '64ca282e2ec7d2de31255dc7c3a16b06b3cc5e00' }}
  # The test excluded from the gate, run in the `non-gating` job:
  #   F6 v2 T7: two actors ...    a wall-clock proof of parallelism: two 200 ms
  #                               sleeps must finish inside 350 ms
  #                               (tests/unit/test_worker_thread.cpp:152-169).
  #                               Its own comment records loaded machines at
  #                               230-280 ms, so the margin on a shared runner is
  #                               tens of milliseconds.  It is a good test and a
  #                               bad gate.
  PROTOIO_REPO: gamarino/protoIO
  # protoIO 0.4.0 (main, 41a5db0, not yet tagged): file::EndGuard and
  # Error::Kind::Conflict (the BinaryFile end guard), on top of 0.3.0's
  # positioned binary files, the ProtoBase-compatible owner lock, packing,
  # CRC32/BLAKE2b/SHA-256/HMAC, base64 and MessagePack, so 0.4.0 is also the
  # floor CMakeLists.txt declares. Pinned so a red build is attributable;
  # bump deliberately (to the v0.4.0 tag once it exists).
  PROTOIO_REF: 41a5db00ebe897155275a662d1e8342060a49aea
  NON_GATING_TESTS: '^(F6 v2 T7: two actors run in parallel \(wall-clock proof\))$'

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build and test suite
            # Empty: env.PROTOCORE_REF (3.5.0, or master on the schedule).
            protocore_ref: ''
          # THE FLOOR JOB, the only one in this repository (cross-platform.yml
          # builds the pin on macOS and Windows). protoCore 3.4.0 (tag v3.4.0,
          # f63adc08), SOVERSION 5: PROTOCORE_MIN_VERSION in CMakeLists.txt,
          # one release behind the 3.5.0 pin. 3.4.0 changed ProtoContext's
          # layout, so no older protoCore links. Built on every event, the schedule
          # included, so a change that needs a newer protoCore is caught
          # before the declared minimum becomes a lie.
          - name: Build and test suite (protoCore 3.4.0 floor)
            protocore_ref: f63adc0881eb00547cc42c1c1cf18c7c4941b978
    steps:
      - name: Check out protoST
        uses: actions/checkout@v4
        with:
          path: protoST

      - name: Check out protoCore as a sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PROTOCORE_REPO }}
          ref: ${{ matrix.protocore_ref || env.PROTOCORE_REF }}
          path: protoCore

      - name: Check out protoIO as a sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PROTOIO_REPO }}
          ref: ${{ env.PROTOIO_REF }}
          path: protoIO

      - name: Record what is being built
        env:
          PROTOCORE_REF: ${{ matrix.protocore_ref || env.PROTOCORE_REF }}
        run: |
          cmake --version | head -1
          g++ --version | head -1
          {
            echo "protoST at \`$(git -C protoST rev-parse HEAD)\`"
            echo "protoCore ref \`$PROTOCORE_REF\` at \`$(git -C protoCore rev-parse HEAD)\`"
            echo "protoIO ref \`$PROTOIO_REF\` at \`$(git -C protoIO rev-parse HEAD)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install libreadline, OpenSSL and Python's msgpack
        # protoST's REPL links readline; find_library(... REQUIRED) fails the
        # configure without it.  protoIO needs OpenSSL's headers (TLS).
        # cli_binary_interop compares bytes with CPython's msgpack module; it
        # is installed for the interpreter the tests run (/usr/bin/python3,
        # passed to CMake below), and checked, so the test runs instead of
        # skipping.
        run: |
          sudo apt-get update
          sudo apt-get install -y libreadline-dev libssl-dev python3-msgpack
          /usr/bin/python3 -c "import msgpack; print('msgpack', msgpack.version)"

      - name: Build protoCore
        run: |
          cmake -S protoCore -B protoCore/build_release -DCMAKE_BUILD_TYPE=Release
          cmake --build protoCore/build_release --target protoCore --parallel "$(nproc)"

      - name: Build protoIO
        run: |
          cmake -S protoIO -B protoIO/build_release -DCMAKE_BUILD_TYPE=Release -DPROTOIO_BUILD_TESTS=OFF
          cmake --build protoIO/build_release --target protoio --parallel "$(nproc)"

      - name: Configure protoST
        # Catch2 v3.5.4 and nlohmann/json v3.11.3 are fetched at configure time
        # (cmake/FindOrFetchCatch2.cmake, cmake/FindOrFetchNlohmannJson.cmake), so
        # this step needs network access.  An offline runner would have to seed
        # FETCHCONTENT_BASE_DIR with both.
        working-directory: protoST
        run: cmake -B build_release -S . -DCMAKE_BUILD_TYPE=Release -DprotoIO_DIR="$GITHUB_WORKSPACE/protoIO/build_release" -DPython3_EXECUTABLE=/usr/bin/python3

      - name: Build protoST
        working-directory: protoST
        run: cmake --build build_release --parallel "$(nproc)"

      - name: Report the registered test count
        # Printed, never asserted.  This family's counts moved four times in
        # three days; a hard-coded total turns every new test into a red build.
        working-directory: protoST
        run: |
          COUNT=$(ctest --test-dir build_release -N | tail -1)
          echo "$COUNT"
          echo "protoST ctest: $COUNT" >> "$GITHUB_STEP_SUMMARY"

      - name: Test suite
        # `< /dev/null` is S18's mitigation and is not optional -- see the header.
        # `--timeout 300` is a hang bound, not a measurement: the whole suite
        # finishes in well under a minute, so no honest case comes near it, and a
        # test that does hang is reported by name instead of consuming the job.
        # -j2 rather than -j$(nproc): the actor-stress and GC-shutdown cases spawn
        # their own workers, and saturating a 4-vCPU runner with ctest workers is
        # the load this family has already been burned by.
        working-directory: protoST
        run: ctest --test-dir build_release -j2 --timeout 300 --output-on-failure -E "$NON_GATING_TESTS" < /dev/null

      - name: Static conformance ratchet
        # The static half of the embedder conformance suite: a delta gate, not a
        # count gate.  Measured green (exit 0) on this tree before this workflow
        # was added.
        #
        # The twelve RUNTIME conformance cases are NOT run here, and that is not
        # an omission by this workflow: protoST has no proto::conformance::Host
        # yet, so no embedder-conformance test is registered in its ctest suite
        # at all (docs/CONFORMANCE.md, "What is not covered").
        working-directory: protoST
        run: python3 ../protoCore/scripts/conformance/check_static.py --repo .

      - name: VS Code extension integration tests
        # editor-integration/vscode/test: the extension's own code (the F5
        # provider, the adapter lookup, launch refusals) in a real VS Code
        # Extension Development Host -- a pinned VS Code under xvfb -- against
        # the protost just built. Local launches only: the remote test needs
        # WSL and skips itself. About a minute, most of it the download.
        if: matrix.protocore_ref == ''
        timeout-minutes: 10
        working-directory: protoST/editor-integration/vscode
        env:
          PROTO_E2E_EXE: ${{ github.workspace }}/protoST/build_release/protost
          VSCODE_TEST_CACHE: ${{ runner.temp }}/vscode-test
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0t64 libxss1 libsecret-1-0
          npm ci --no-audit --no-fund
          xvfb-run -a npm test < /dev/null

  non-gating:
    name: 'The wall-clock proof (informational, never gates)'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # A failure here does not fail the run.  The test is kept RUNNING rather than
    # weakened or deleted: it is a good test and a bad gate (see NON_GATING_TESTS
    # above), and an intermittently red gate trains readers to re-run instead
    # of to look.
    continue-on-error: true
    steps:
      - name: Check out protoST
        uses: actions/checkout@v4
        with:
          path: protoST

      - name: Check out protoCore as a sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PROTOCORE_REPO }}
          ref: ${{ env.PROTOCORE_REF }}
          path: protoCore

      - name: Check out protoIO as a sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PROTOIO_REPO }}
          ref: ${{ env.PROTOIO_REF }}
          path: protoIO

      - name: Install libreadline and OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y libreadline-dev libssl-dev

      - name: Build protoCore
        run: |
          cmake -S protoCore -B protoCore/build_release -DCMAKE_BUILD_TYPE=Release
          cmake --build protoCore/build_release --target protoCore --parallel "$(nproc)"

      - name: Build protoIO
        run: |
          cmake -S protoIO -B protoIO/build_release -DCMAKE_BUILD_TYPE=Release -DPROTOIO_BUILD_TESTS=OFF
          cmake --build protoIO/build_release --target protoio --parallel "$(nproc)"

      - name: Build protoST
        working-directory: protoST
        run: |
          cmake -B build_release -S . -DCMAKE_BUILD_TYPE=Release -DprotoIO_DIR="$GITHUB_WORKSPACE/protoIO/build_release"
          cmake --build build_release --parallel "$(nproc)"

      - name: Run the clock-dependent case, retrying up to three times
        working-directory: protoST
        run: |
          set +e
          ctest --test-dir build_release --output-on-failure \
                -R "$NON_GATING_TESTS" --repeat until-pass:3 < /dev/null
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "Non-gating case: the wall-clock parallelism proof passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Non-gating case: the wall-clock parallelism proof FAILED three attempts in a row; it may still be runner load." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$STATUS"
